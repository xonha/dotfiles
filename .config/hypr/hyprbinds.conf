source = ./hyprvariables.conf

# -- Playerctl --
bind = , $F16, exec, playerctl previous
bind = , $F17, exec, playerctl play-pause
bind = , $F18, exec, playerctl next

# -- Apps --
bind = SUPER, g, exec, $focus $explorer nemo
bind = SUPER, w, exec, $focus $whatsapp $whatsapp_
bind = SUPER, e, exec, $focus $todoist $todoist_
bind = SUPER, r, exec, $focus $ytmusic $ytmusic_
bind = SUPER, s, exec, $focus $devbot $devbot_
bind = SUPER, d, exec, $focus $maistodos $maistodos_

bind = SUPER, i, exec, $focus "kitty --class wlctl -e wlctl" wlctl
bind = SUPER, u, exec, $focus "kitty --class bluetui -e bluetui" bluetui

bind = SUPER,       x, exec, $focus "kitty --class kitty-devbox    -e ssh devbox    -t 'tmux new-session -A -s main'" kitty-devbox    emptyn
bind = SUPER_SHIFT, x, exec, $focus "kitty --class kitty-devbox    -e ssh devbox    -t 'tmux new-session -A -s main'" kitty-devbox    current 1
bind = SUPER,       c, exec, $focus "kitty --class kitty-maistodos -e ssh maistodos -t 'tmux new-session -A -s main'" kitty-maistodos emptyn
bind = SUPER_SHIFT, c, exec, $focus "kitty --class kitty-maistodos -e ssh maistodos -t 'tmux new-session -A -s main'" kitty-maistodos current 1
bind = SUPER,       v, exec, $focus "kitty -e tmux new-session -A -s main" kitty emptyn
bind = SUPER_SHIFT, v, exec, $focus "kitty -e tmux new-session -A -s main" kitty current 1

bind = SUPER,       f, exec, $focus $brave $brave_ workspace:1
bind = SUPER_SHIFT, f, exec, $focus $brave $brave_ current 1

bind = SUPER,       a, exec, $focus code code emptyn
bind = SUPER_SHIFT, a, exec, $focus "code -n" code current 1

# -- Misc --
bind = SUPER, Backspace,  exec, $powermenu
bind = SUPER, Space,      exec, hyprlauncher
bind = SUPER, Delete,     exec, hyprlauncher
bind = SUPER, $Ç1,        exec, hyprlock
bind = SUPER, p,          exec, hyprpicker --autocopy --notify
bind = SUPER, t,          exec, $volume --toggle-mic
bind = SUPER, k,          exec, $keyd --toggle
bind = SUPER, n,          exec, $denoise toggle
bind = SUPER, j,          exec, hyprctl kill
bind = SUPER, z,          exec, grim -g "$(slurp)" - | swappy -f -

# -- Function keys --
bind = ,XF86MonBrightnessUp,   exec, $backlight --inc
bind = ,XF86MonBrightnessDown, exec, $backlight --dec
bind = ,XF86AudioRaiseVolume,  exec, $volume --inc
bind = ,XF86AudioLowerVolume,  exec, $volume --dec
bind = ,XF86AudioMute,         exec, $volume --toggle
bind = ,XF86AudioMicMute,      exec, $volume --toggle-mic
bind = ,XF86AudioNext,         exec, playerctl next
bind = ,XF86AudioPrev,         exec, playerctl previous
bind  = ,XF86AudioPlay,        exec, $volume --toggle-mic
bind  = ,XF86AudioPause,       exec, $volume --toggle-mic
bind = ,XF86AudioStop,         exec, playerctl stop

# -- Hyprland --
bind = SUPER,       q, killactive,
bind = SUPER,       b, movetoworkspace, empty
bind = SUPER_SHIFT, b, togglefloating,
bind = SUPER_SHIFT, b, centerwindow,
bind = SUPER_SHIFT, t, exec, hyprctl reload

# Change Focus
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d
bind = SUPER, h,     movefocus, l
bind = SUPER, l,     movefocus, r

# Move Active
bind = SUPER_ALT, left,  movewindow, l
bind = SUPER_ALT, right, movewindow, r
bind = SUPER_ALT, up,    movewindow, u
bind = SUPER_ALT, down,  movewindow, d
bind = SUPER_ALT, h,     movewindow, l
bind = SUPER_ALT, l,     movewindow, r

# Resize Active
binde = SUPER_SHIFT, left,  resizeactive, -20 0
binde = SUPER_SHIFT, right, resizeactive, 20 0
binde = SUPER_SHIFT, up,    resizeactive, 0 -20
binde = SUPER_SHIFT, down,  resizeactive, 0 20
binde = SUPER_SHIFT, h,     resizeactive, -20 0
binde = SUPER_SHIFT, l,     resizeactive, 20 0
binde = SUPER_SHIFT, Return,fullscreen

# Fake fullscreen (janela segue no tile, app pensa que esta fullscreen)
bind = SUPER_ALT, b, fullscreenstate, 0 2


# Move Active (Floating Only)
binde = SUPER_ALT, left,  moveactive, -20 0
binde = SUPER_ALT, right, moveactive, 20 0
binde = SUPER_ALT, up,    moveactive, 0 -20
binde = SUPER_ALT, down,  moveactive, 0 20

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Send to Workspaces
bind = SUPER_CTRL, 1, movetoworkspace, 1
bind = SUPER_CTRL, 2, movetoworkspace, 2
bind = SUPER_CTRL, 3, movetoworkspace, 3
bind = SUPER_CTRL, 4, movetoworkspace, 4
bind = SUPER_CTRL, 5, movetoworkspace, 5
bind = SUPER_CTRL, 6, movetoworkspace, 6
bind = SUPER_CTRL, 7, movetoworkspace, 7
bind = SUPER_CTRL, 8, movetoworkspace, 8
bind = SUPER_CTRL, 9, movetoworkspace, 9

# Misc
bindl = ,switch:Lid Switch, exec, hyprlock
bind  = SUPER_ALT, P, pin,
bind  = SUPER_ALT, P, exec, $notifycmd 'Toggled Pin'
bind  = SUPER_ALT, S, swapnext

#-- Mouse Buttons ----------------------------------------------
bindm = SUPER, mouse:272,  movewindow
bindm = SUPER, mouse:273,  resizewindow
bind  = SUPER, mouse_down, workspace, e+1
bind  = SUPER, mouse_up,   workspace, e-1
