#
# Symbol mapping (special font for specified unicode code points). Map the
# specified unicode codepoints to a particular font. Useful if you need special
# rendering for some symbols, such as for Powerline. Avoids the need for
# patched fonts. Each unicode code point is specified in the form U+<code point
# in hexadecimal>. You can specify multiple code points, separated by commas
# and ranges separated by hyphens. symbol_map itself can be specified multiple times.
# Syntax is:
#
# symbol_map codepoints Font Family Name
#
# For example:
#
#symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3 PowerlineSymbols
hide_window_decorations yes
macos_option_as_alt no
remember_window_size  no
initial_window_width  2500
initial_window_height 1380

# Change the color of the kitty window's titlebar on macOS. A value of "system"
# means to use the default system color, a value of "background" means to use
# the default background color and finally you can use an arbitrary color, such
# as #12af59 or "red".
macos_titlebar_color background

allow_remote_control yes
confirm_os_window_close 0

## Catppuccin Mocha Theme (Custom)
# The basic colors
foreground              #ffffff
background              #151515
selection_foreground    #ffffff
selection_background    #2a2a2a

# Cursor colors
cursor                  #b8b8b8
cursor_text_color       #151515

# URL underline color when hovering with mouse
url_color               #b8b8b8

# Kitty window border colors
active_border_color     #5f5f5f
inactive_border_color   #3f3f3f
bell_border_color       #4f4f4f

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #ffffff
active_tab_background   #232323
inactive_tab_foreground #9e9e9e
inactive_tab_background #121212
tab_bar_background      #0f0f0f

# Colors for marks (marked text in the terminal)
mark1_foreground #151515
mark1_background #5f5f5f
mark2_foreground #151515
mark2_background #4f4f4f
mark3_foreground #151515
mark3_background #b8b8b8

# The 16 terminal colors

# black
color0 #1c1c1c
color8 #3f3f3f

# red
color1 #F38BA8
color9 #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #b8b8b8
color15 #ffffff

include themes/noctalia.conf
