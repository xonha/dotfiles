# vim:fileencoding=utf-8:ft=conf

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
bold_italic_font auto
italic_font      auto
font_size 11.0

# Cursor
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000
scrollback_pager less +G -R
wheel_scroll_multiplier 5.0

# Mouse
click_interval 0.5
select_by_word_characters :@-./_~?&=%+#
mouse_hide_wait 0.0

# Window
enabled_layouts *
remember_window_size   no
initial_window_width   640
initial_window_height  400

# Rendering
repaint_delay    10
input_delay 3

# Bell
visual_bell_duration 0.0
enable_audio_bell no

# URLs
open_url_modifiers ctrl+shift
open_url_with default

# Terminal
term xterm-kitty
window_border_width 0
window_margin_width 0
window_padding_width 0

# Ctrl+Backspace sends Ctrl+W for consistent word deletion.
map ctrl+backspace send_text all \x17

# Clipboard
clipboard_control write-clipboard read-clipboard

hide_window_decorations yes
macos_option_as_alt no
remember_window_size  no
initial_window_width  2500
initial_window_height 1380

# macOS
macos_titlebar_color background

allow_remote_control yes
confirm_os_window_close 0

# Fallback theme; Noctalia overrides it below.
foreground              #ffffff
background              #151515
selection_foreground    #ffffff
selection_background    #2a2a2a

cursor                  #b8b8b8
cursor_text_color       #151515

url_color               #b8b8b8

active_border_color     #5f5f5f
inactive_border_color   #3f3f3f
bell_border_color       #4f4f4f

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground   #ffffff
active_tab_background   #232323
inactive_tab_foreground #9e9e9e
inactive_tab_background #121212
tab_bar_background      #0f0f0f

mark1_foreground #151515
mark1_background #5f5f5f
mark2_foreground #151515
mark2_background #4f4f4f
mark3_foreground #151515
mark3_background #b8b8b8

# ANSI colors
color0 #1c1c1c
color8 #3f3f3f

color1 #F38BA8
color9 #F38BA8

color2  #A6E3A1
color10 #A6E3A1

color3  #F9E2AF
color11 #F9E2AF

color4  #89B4FA
color12 #89B4FA

color5  #F5C2E7
color13 #F5C2E7

color6  #94E2D5
color14 #94E2D5

color7  #b8b8b8
color15 #ffffff

include themes/noctalia.conf
