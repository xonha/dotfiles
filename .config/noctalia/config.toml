[nightlight]
enabled = true
temperature_night = 4500

[plugin_settings."icefish/phone-connect"]
battery_display = "hidden"
show_device_name = true

[plugin_settings."blackbartblues/audio-switcher"]
show_actions_in_tooltip = true
show_notification_on_switch = true
show_percentage = true

[plugin_settings."icefish/phone-operate"]
battery_display = "hidden"
show_device_name = true

[plugin_settings."kenn/keybind-cheatsheet"]
compositor = "hyprland"
hyprland_lua_config = "~/.config/hypr/binds.lua"
hyprland_parser = "lua"

[plugin_settings."oldirtty/color_picker"]
panel_position = "top_left"

[plugins]
enabled = [
  "xonha/desktop-controls",
  "oldirtty/color_picker",
  "yuuto/calculator",
  "noctalia/screen_recorder",
  "noctalia/notes",
  "blackbartblues/keymap",
  "blackbartblues/audio-switcher",
  "raycursive/github-prs",
  "kenn/keybind-cheatsheet",
  "icefish/phone-connect",
]

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

[shell.animation]
speed = 1.2000000178813934

[shell.greeter_sync]
auto_sync = true

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[shell.screenshot]
copy_to_clipboard = false
pipe_command = "satty -f -"
pipe_to_command = true
save_to_file = false

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 3.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 3.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
enabled = true
shortcut = "5"
variant = "destructive"

[system.monitor]
cpu_poll_seconds = 3
disk_poll_seconds = 30
gpu_poll_seconds = 2
memory_poll_seconds = 10

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
custom_palette = "Catppuccin-Black"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = ["btop", "kcolorscheme", "kitty", "qt", "alacritty"]

[wallpaper.default]
path = "/home/henrique/.wallpaper.jpg"

[wallpaper.last]
path = "/home/henrique/.wallpaper.jpg"

[wallpaper.monitors.DP-3]
path = "/home/henrique/.wallpaper.jpg"

[wallpaper.monitors.DP-4]
path = "/home/henrique/.wallpaper.jpg"

[widget.bar]
color = "#f2cdcd"
enabled = false
hide_when_zero = true
scale = 1.1000000000000001
type = "raycursive/github-prs:bar"

[widget.bar_2]
font_scale = 1.1000000000000001
scale = 1.2000000000000002
type = "icefish/phone-connect:bar"

[widget.battery]
color = "#a6e3a1"
show_label = true

[widget.bluetooth]
color = "#89b4fa"
show_label = true

[widget.brave_profile]
color = "#f5e0dc"
type = "xonha/desktop-controls:brave-profile"

[widget.brightness]
color = "#89dceb"
show_label = true

[widget.calendar]
type = "xonha/desktop-controls:calendar"

[widget.calendar.actions]
left = "panel-toggle control-center calendar"
scroll_down = "volume-down"
scroll_up = "volume-up"

[widget.clock]
color = "#cba6f7"
format = "{:%H:%M}"

[widget.clock.actions]
left = "panel-toggle control-center notifications"
scroll_down = "volume-down"
scroll_up = "volume-up"

[widget.cpu]
color = "#eba0ac"
show_value = true
stat = "cpu_usage"
type = "sysmon"
visualization = "none"

[widget.disk]
color = "#f9e2af"
highlight_color = "#f9e2af"
path = "/"
show_value = true
stat = "disk_free"
type = "sysmon"
visualization = "none"

[widget.input_volume]
type = "xonha/desktop-controls:input_volume"

[widget.keyd]
color = "#94E2D5"
icon_color = "#94E2D5"
type = "xonha/desktop-controls:keyd"

[widget.launcher]
color = "secondary"

[widget.lock_keys]
display = "full"
icon_color = "#94E2D5"
type = "xonha/desktop-controls:lock_keys"

[widget.media]
hide_when_no_media = true

[widget.network]
type = "xonha/desktop-controls:network"

[widget.network.actions]
left = "panel-toggle control-center network"
right = "network-toggle"

[widget.audio_switcher]
type = "blackbartblues/audio-switcher:widget"

[widget.ram]
color = "#fab387"
show_value = true
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.recorder]
enabled = false
scale = 1.2000000000000002
type = "noctalia/screen_recorder:recorder"

[widget.status]
font_weight = 700
scale = 1.0
type = "icefish/phone-connect:bar"

[widget.taskbar]
active_opacity = 1.0
group_by_workspace = false
inactive_opacity = 1.0
item_spacing = 4
show_active_indicator = true
show_all_outputs = false

[widget.temp]
color = "#f38ba8"
show_value = true
stat = "cpu_temp"
type = "sysmon"
visualization = "none"
