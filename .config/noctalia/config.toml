[accessibility]
ui_scale = 1.2

[bar.default]
background_opacity = 1.0
capsule = false
center = ["taskbar", "tray"]
concave_edge_corners = false
end = [
  "battery",
  "keyd",
  "lock_keys",
  "brightness",
  "input_volume",
  "audio_switcher",
  "bluetooth",
  "bar_2",
  "network",
  "calendar",
  "clock",
]
font_scale = 1.0
font_weight = 700
margin_edge = 5
margin_ends = 8
padding = 8
radius = 4
scale = 1.0
shadow = false
start = ["temp", "cpu", "ram", "disk", "brave_profile", "bar", "recorder"]
thickness = 27
widget_spacing = 6

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
  "lockscreen-login-box@DP-6",
  "lockscreen-login-box@DP-5",
  "lockscreen-login-box@FALLBACK",
  "lockscreen-login-box@DP-4",
  "lockscreen-login-box@DP-3",
  "lockscreen-login-box@eDP-1",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "DP-3"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

