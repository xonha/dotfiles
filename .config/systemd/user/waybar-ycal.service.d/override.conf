# /etc/environment define BROWSER=firefox pra sessao inteira via pam_env, e o
# firefox nao esta instalado. O fluxo OAuth usa flow.run_local_server(), que
# chama webbrowser.open() -- e o webbrowser honra $BROWSER antes de tudo, tenta
# executar `firefox`, falha em silencio e retorna False. O botao fica preso em
# "Opening browser..." esperando um callback que nunca chega.
#
# Sem BROWSER o webbrowser cai no xdg-open, que resolve pelo mimeapps.list.
# systemctl --user unset-environment nao resolve: a variavel e herdada do PAM,
# fora do bloco que o manager controla.
[Service]
UnsetEnvironment=BROWSER

# Troca o popup do pacote pelo nosso launcher, que ancora a janela no canto
# superior direito antes de executar. Ver .config/scripts/ycal-popup.py.
ExecStart=
ExecStart=%h/.config/scripts/ycal-popup.py
