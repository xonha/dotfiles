id = "xonha/desktop-controls"
name = "Desktop Controls"
version = "1.0.0"
plugin_api = 24
author = "Henrique Oliveira"
license = "MIT"
dependencies = ["systemctl", "xdg-mime"]
tags = ["bar", "browser", "hardware", "utility"]
icon = "adjustments"
description = "Bar indicators for Keyd, the default Brave profile, and microphone state."

[[widget]]
id = "keyd"
entry = "keyd.luau"

[[widget]]
id = "brave-profile"
entry = "brave-profile.luau"

[[widget]]
id = "input_volume"
entry = "input-volume.luau"

[[widget]]
id = "lock_keys"
entry = "lock-keys.luau"

[[widget]]
id = "calendar"
entry = "calendar.luau"

[[widget]]
id = "network"
entry = "network.luau"
