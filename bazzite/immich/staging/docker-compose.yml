# Isolated Immich staging on Bazzite. Never point these paths at production.
name: immich-staging

services:
  immich-server:
    container_name: ${IMMICH_SERVER_CONTAINER:-immich_staging_server}
    image: ${IMMICH_SERVER_IMAGE:-ghcr.io/immich-app/immich-server:v3.3.1}
    volumes:
      - ${UPLOAD_LOCATION}:/data:Z
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '127.0.0.1:${IMMICH_HTTP_PORT:-2284}:2283'
    depends_on:
      - redis
      - database
    restart: 'no'
    networks:
      - staging

  immich-machine-learning:
    container_name: ${IMMICH_ML_CONTAINER:-immich_staging_machine_learning}
    image: ${IMMICH_ML_IMAGE:-ghcr.io/immich-app/immich-machine-learning:v3.3.1}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: 'no'
    networks:
      - staging
      - ml-egress

  redis:
    container_name: ${IMMICH_REDIS_CONTAINER:-immich_staging_redis}
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: 'no'
    networks:
      - staging

  database:
    container_name: ${IMMICH_DB_CONTAINER:-immich_staging_postgres}
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data:Z
    shm_size: 128mb
    restart: 'no'
    networks:
      - staging

volumes:
  model-cache:

networks:
  staging:
    internal: true
  ml-egress:
