# Omarchy environment (OMARCHY_PATH + PATH), needed even for non-interactive shells
[[ -r /usr/share/omarchy/default/bash/env-bootstrap ]] && source /usr/share/omarchy/default/bash/env-bootstrap

# Lab has no logind session, so its start script creates the runtime dir and
# the Podman API service; SSH logins must share that runtime dir with it.
if [[ -z ${XDG_RUNTIME_DIR:-} && -d /run/user/$UID && -O /run/user/$UID ]]; then
  export XDG_RUNTIME_DIR="/run/user/$UID"
fi

# Rootless Podman replaces Docker. Point Docker API clients (docker-compose,
# testcontainers, lazydocker) at the user socket when the Podman API is up
# (podman.socket on Omarchy, the start script on Lab).
# Ryuk needs a privileged socket mount that rootless Podman does not provide.
podman_sock="${XDG_RUNTIME_DIR:-/run/user/$UID}/podman/podman.sock"
if [[ -S $podman_sock ]]; then
  export DOCKER_HOST="unix://$podman_sock"
  export TESTCONTAINERS_RYUK_DISABLED=true
fi
unset podman_sock

# If not running interactively, don't do anything else (leave this above the rc source)
[[ $- != *i* ]] && return

# All the default Omarchy aliases and functions. Plain Arch development
# containers do not have Omarchy, so keep this block optional.
if [[ -n ${OMARCHY_PATH:-} && -r "$OMARCHY_PATH/default/bash/rc" ]]; then
  source "$OMARCHY_PATH/default/bash/rc"
fi

# Omarchy loads its Readline bindings above. Load ble.sh afterwards so its
# bind wrapper does not attempt to parse unsupported stock Readline functions.
# The AUR package uses /usr/share; the standalone fallback uses /usr/local.
for blesh_path in /usr/share/blesh/ble.sh /usr/local/share/blesh/ble.sh "$HOME/.local/share/blesh/ble.sh"; do
  if [[ -r $blesh_path ]]; then
    source "$blesh_path" --noattach
    break
  fi
done
unset blesh_path

# ble.sh's builtin faces hardcode xterm 256-color indices (16-255), which the
# Catppuccin Mocha foot theme doesn't retheme (only ANSI 0-15 are remapped).
# Swap every hardcoded index for its nearest Catppuccin Mocha equivalent.
if [[ ${BLE_VERSION-} ]]; then
  ble-color-defface menu_filter_input        fg=233,bg=223
  ble-color-defface syntax_expr              fg=111
  ble-color-defface syntax_error             bg=211,fg=189
  ble-color-defface syntax_varname           fg=216
  ble-color-defface syntax_history_expansion bg=223,fg=189
  ble-color-defface syntax_function_name     fg=183,bold
  ble-color-defface syntax_comment           fg=241
  ble-color-defface syntax_glob              fg=218,bold
  ble-color-defface syntax_brace             fg=116,bold
  ble-color-defface syntax_document          fg=223
  ble-color-defface syntax_document_begin    fg=223,bold
  ble-color-defface command_function         fg=183
  ble-color-defface command_directory        fg=111,underline
  ble-color-defface filename_directory       underline,fg=111
  ble-color-defface filename_directory_sticky underline,fg=white,bg=111
  ble-color-defface filename_orphan          underline,fg=teal,bg=224
  ble-color-defface filename_setuid          underline,fg=black,bg=223
  ble-color-defface filename_setgid          underline,fg=black,bg=223
  ble-color-defface vbell_erase              bg=146
  ble-color-defface region                   bg=243,fg=white
  ble-color-defface region_target            bg=111,fg=black
  ble-color-defface region_match             bg=183,fg=white
  ble-color-defface disabled                 fg=241
  ble-color-defface overwrite_mode           fg=black,bg=116
  ble-color-defface menu_complete            fg=12,bg=146
  ble-color-defface auto_complete            bg=189,fg=237
  ble-color-defface cmdinfo_cd_cdpath        fg=111,bg=151
fi

# Personal environment migrated from the previous Zsh setup.
export OZONE_PLATFORM_HINT=wayland
export LANG=C.UTF-8
export LC_ALL=C.UTF-8

# Keep the same command precedence as before.
export PATH="$HOME/.sst/bin:$HOME/go/bin:$HOME/.local/bin:$PATH"

# Persistent Bash history, including commands from concurrent shells.
HISTFILE="$HOME/.bash_history"
HISTSIZE=10000
HISTFILESIZE=10000
shopt -s histappend
PROMPT_COMMAND="history -a; history -n${PROMPT_COMMAND:+; $PROMPT_COMMAND}"

# Readline equivalent of the old Zsh Ctrl-H binding.
bind -m emacs-standard '"\C-h": backward-kill-word'

# Node version manager supplied by Arch.
[[ -r /usr/share/nvm/init-nvm.sh ]] && source /usr/share/nvm/init-nvm.sh

v() {
  if [[ -d ${1:-} ]]; then
    builtin cd -- "$1" && nvim .
  elif [[ -f ${1:-} ]]; then
    nvim -- "$1"
  else
    nvim .
  fi
}

o() {
  if [[ -d ${1:-} ]]; then
    builtin cd -- "$1" && opencode .
  elif [[ -f ${1:-} ]]; then
    opencode "$1"
  else
    opencode .
  fi
}

_dotfiles_dir() {
  local dir
  for dir in "$HOME/Dotfiles" "$HOME/dotfiles"; do
    [[ -d $dir ]] && { printf '%s\n' "$dir"; return; }
  done
  return 1
}

dot() {
  local dir
  if dir=$(_dotfiles_dir); then
    builtin cd -- "$dir" && nvim .
  else
    printf '%s\n' 'Dotfiles directory not found.' >&2
  fi
}

venv() { source .venv/bin/activate; }

alias l='ls -lh'
alias ll='ls -lah'
alias la='ls -A'
alias lm='ls -m'
alias lr='ls -R'
alias lg='ls -l --group-directories-first'
alias g='git'
alias gc='git checkout'
alias gcp='git cherry-pick'
alias dotfiles='dot'
alias maistodos='ssh maistodos'
alias bazzite='ssh bazzite'
alias laptop='ssh laptop'
alias lab='ssh lab'

# Match a package entry ("  name" or "  aur/name", optional comment) in a
# setup/packages-*.sh array. Prints matching line numbers when asked to.
_pkg_entry() {
  awk -v pkg="$2" '
    /^[[:space:]]+[^[:space:]#]/ && ($1 == pkg || $1 == "aur/" pkg) { print NR; found = 1 }
    END { exit !found }
  ' "$1"
}

# Install with yay, then offer to record each newly installed package in the
# client (Omarchy) or server (shared CLI) package list of the dotfiles repo.
add() {
  local before
  before=$(pacman -Qqe)
  yay --noconfirm --removemake "$@" || return

  local -a new
  mapfile -t new < <(comm -13 <(sort <<<"$before") <(pacman -Qqe | sort))
  ((${#new[@]})) || return 0

  local dir
  dir=$(_dotfiles_dir) || return 0

  local pkg choice file prefix repo entry
  for pkg in "${new[@]}"; do
    read -rp "Save '$pkg' to [c]lient, [s]erver or [N]one? " choice
    case $choice in
      c | C) file=$dir/setup/pkg_client.sh prefix=PKG_OMARCHY ;;
      s | S) file=$dir/setup/pkg_server.sh prefix=PKG_SERVER ;;
      *) continue ;;
    esac

    if pacman -Qqm "$pkg" >/dev/null 2>&1; then
      repo=AUR entry=aur/$pkg
    else
      repo=EXTRA entry=$pkg
    fi

    if _pkg_entry "$file" "$pkg" >/dev/null; then
      printf '%s\n' "'$pkg' is already listed in ${file##*/}."
      continue
    fi

    local tmp
    tmp=$(mktemp) || return
    awk -v arr="${prefix}_$repo" -v entry="$entry" '
      $0 == arr "=(" { inside = 1 }
      inside && $0 == ")" { print "  " entry; inside = 0 }
      { print }
    ' "$file" >"$tmp" && cat "$tmp" >"$file"
    rm -f "$tmp"
    printf '%s\n' "Added '$entry' to ${prefix}_$repo in ${file##*/}."
  done
}

# Remove with yay, then offer to drop each removed package from the dotfiles
# package lists that still reference it.
del() {
  local before
  before=$(pacman -Qq)
  yay -R --noconfirm "$@" || return

  local -a gone
  mapfile -t gone < <(comm -23 <(sort <<<"$before") <(pacman -Qq | sort))
  ((${#gone[@]})) || return 0

  local dir
  dir=$(_dotfiles_dir) || return 0

  local pkg file lines choice
  for pkg in "${gone[@]}"; do
    for file in "$dir"/setup/packages-{client,server}.sh; do
      lines=$(_pkg_entry "$file" "$pkg") || continue
      read -rp "Remove '$pkg' from ${file##*/}? [y/N] " choice
      [[ $choice == [yY] ]] || continue
      sed -i "$(printf '%sd;' $lines)" "$file"
      printf '%s\n' "Removed '$pkg' from ${file##*/}."
    done
  done
}

up() {
  if [[ -n ${OMARCHY_PATH:-} ]] && command -v omarchy >/dev/null 2>&1; then
    omarchy update
    return
  fi

  yay --noconfirm --removemake || return
  local orphans
  orphans=$(pacman -Qdtq 2>/dev/null) || return 0
  [[ -n $orphans ]] && sudo pacman -Rns --noconfirm $orphans
}

eval "$(starship init bash)"

# ble-attach must come last so ble.sh wraps the final prompt/readline setup.
[[ ${BLE_VERSION-} ]] && ble-attach
