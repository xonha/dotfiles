# WSL2 only: the Microsoft kernel is built without CONFIG_NFT_FIB_INET, which
# netavark's nftables driver needs, so every rootless bridge network (Compose
# networks, port publishing) fails with "Could not process rule". Rules would
# only live inside the rootless network namespace anyway; pasta and
# rootlessport still provide egress and published ports without them.
# Installed by setup/services.sh when running under WSL.
[network]
firewall_driver = "none"
