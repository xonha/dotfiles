config:
  dotpath: ..
  backup: true

dotfiles:
  agents_profiles:
    src: ai/agents
    dst: ~/.agents/agents
    link: absolute
  agents_skills:
    src: ai/skills
    dst: ~/.agents/skills
    link: link_children
  claude_skills:
    src: ai/skills
    dst: ~/.claude/skills
    link: absolute

  bash_profile:
    src: config/bash.conf
    dst: ~/.bash_profile
    link: absolute
  bashrc:
    src: config/bash.conf
    dst: ~/.bashrc
    link: absolute
  hidden:
    src: .hidden
    dst: ~/.hidden
    link: absolute
  tmux:
    src: config/tmux.conf
    dst: ~/.tmux.conf
    link: absolute

  bazzite_crafty:
    src: bazzite/crafty/crafty.container
    dst: ~/.config/containers/systemd/crafty.container
    link: absolute
  bazzite_keeper:
    src: bazzite/keeper/keeper.container
    dst: ~/.config/containers/systemd/keeper.container
    link: absolute
  bazzite_lab:
    src: bazzite/lab/lab.container
    dst: ~/.config/containers/systemd/lab.container
    link: absolute
  bazzite_lab_home:
    src: bazzite/lab/lab-home.volume
    dst: ~/.config/containers/systemd/lab-home.volume
    link: absolute
  bazzite_samba:
    src: bazzite/samba/samba.container
    dst: ~/.config/containers/systemd/samba.container
    link: absolute
  config_foot:
    src: config/foot.ini
    dst: ~/.config/foot/foot.ini
    link: absolute
  config_speech_to_text:
    src: config/speech-to-text.json
    dst: ~/.config/speech-to-text/config.json
    link: absolute
  config_voxtype:
    src: config/voxtype.toml
    dst: ~/.config/voxtype/config.toml
    link: absolute
  config_hypr:
    src: hypr
    dst: ~/.config/hypr
    link: absolute
  config_hyprmoncfg:
    src: hypr/hyprmoncfg
    dst: ~/.config/hyprmoncfg
    link: absolute
  config_nvim:
    src: nvim
    dst: ~/.config/nvim
    link: absolute
  config_scripts:
    src: config/scripts
    dst: ~/.config/scripts
    link: absolute
  config_starship:
    src: config/starship.toml
    dst: ~/.config/starship.toml
    link: absolute
  omarchy_themes:
    src: omarchy/themes
    dst: ~/.config/omarchy/themes
    link: link_children
  omarchy_shell:
    src: omarchy/shell.json
    dst: ~/.config/omarchy/shell.json
    link: absolute
  omarchy_theme_hook:
    src: omarchy/hooks/theme-set.d/apply-darkppuccin-gtk
    dst: ~/.config/omarchy/hooks/theme-set.d/apply-darkppuccin-gtk
    link: absolute

  shortcuts:
    src: config/shortcuts
    dst: ~/.local/share/applications
    link: link_children
    instignore:
      - mimeinfo.cache
  icons:
    src: config/icons
    dst: ~/.local/share/icons/hicolor/scalable/apps
    link: link_children

  ssh_config:
    src: config/ssh.conf
    dst: ~/.ssh/config
    link: absolute
  themes:
    src: config/darkppuccin
    dst: ~/.themes/Darkppuccin
    link: absolute

profiles:
  omarchy:
    dotfiles:
      - agents_profiles
      - agents_skills
      - claude_skills
      - bash_profile
      - bashrc
      - hidden
      - tmux
      - bazzite_crafty
      - bazzite_keeper
      - bazzite_lab
      - bazzite_lab_home
      - bazzite_samba
      - config_foot
      - config_speech_to_text
      - config_voxtype
      - config_hypr
      - config_hyprmoncfg
      - config_nvim
      - config_scripts
      - config_starship
      - omarchy_themes
      - omarchy_shell
      - omarchy_theme_hook
      - shortcuts
      - icons
      - ssh_config
      - themes
