## On-demand RNNoise virtual microphone for the Blue Snowball.
## The Bluetooth headset remains on its high-fidelity A2DP profile.

context.properties = {
  log.level = 0
}

context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.*       = support/libspa-support
}

context.modules = [
  { name = libpipewire-module-rt
    args = { }
    flags = [ ifexists nofail ]
  }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Blue Snowball (RNNoise)"
      media.name = "Blue Snowball (RNNoise)"

      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = rnnoise
            plugin = "librnnoise_ladspa"
            label = noise_suppressor_mono
            control = {
              "VAD Threshold (%)" = 50.0
            }
          }
        ]
      }

      audio.position = [ MONO ]

      capture.props = {
        node.name = "bt_rnnoise.capture"
        node.description = "Blue Snowball capture (RNNoise input)"
        target.object = "alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball_SUGA_2021_01_21_75536-00.mono-fallback"
        node.passive = false
      }

      playback.props = {
        node.name = "bt_rnnoise"
        node.description = "Blue Snowball (RNNoise)"
        media.class = "Audio/Source"
      }
    }
  }
]
