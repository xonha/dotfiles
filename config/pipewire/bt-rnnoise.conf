## On-demand RNNoise virtual microphone for the BT-50 PRO.
## The toggle script starts this client only while a call needs the mic.

context.properties = {
  log.level = 0
}

context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.*       = support/libspa-support
}

context.modules = [
  { name = libpipewire-module-rt
    args = { }
    flags = [ ifexists nofail ]
  }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "BT-50 PRO microphone (RNNoise)"
      media.name = "BT-50 PRO microphone (RNNoise)"

      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = rnnoise
            plugin = "librnnoise_ladspa"
            label = noise_suppressor_mono
            control = {
              "VAD Threshold (%)" = 50.0
            }
          }
        ]
      }

      audio.position = [ MONO ]

      capture.props = {
        node.name = "bt_rnnoise.capture"
        node.description = "BT-50 PRO capture (RNNoise input)"
        target.object = "bluez_input.00:02:5B:00:FF:0E"
        node.passive = false
      }

      playback.props = {
        node.name = "bt_rnnoise"
        node.description = "BT-50 PRO microphone (RNNoise)"
        media.class = "Audio/Source"
      }
    }
  }
]
